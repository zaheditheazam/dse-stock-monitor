name: DSE Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.11"


    - name: Install packages
      run: |
        pip install -r requirements.txt


    - name: Run monitor
      run: |
        python main.py
